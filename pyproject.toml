[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["frontend", "reports", "templates", ".venv", "backups"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes errors, I = import sorting
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Scripts/tests must put the repo root on sys.path before importing src.*
"tests/*" = ["E402"]
"code/*" = ["E402"]
# HW9: long prompt / log strings (code is formatted by ruff format)
"code/hw9/*" = ["E402", "E501"]
"src/hw9_cache/*" = ["E501"]
"src/hw9_agents/*" = ["E501"]
