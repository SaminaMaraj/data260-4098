# HW9 Part 3.1 - labeled semantic-cache test set (Kazi Samina Maraj Mumu, PREFIX s4098)
#
# Frozen before the threshold sweep. Do NOT relabel after seeing results;
# labeling mistakes are documented in reports/hw09/LABELING_NOTES.md instead.
#
# Procedure (code/hw9/part3_threshold_sweep.py):
#   1. empty the cache, store the 10 seed queries (answers from the HW8 agent path)
#   2. send the 40 cases in this order, read-only (misses are answered by the agent
#      but not stored), so every case is compared with the same 10 seed entries
#   3. repeat for each threshold
#
# expected: hit  -> the cache should return the answer of `target`
#           miss -> the cache should NOT return any cached answer
# A "false hit" = a case served from the cache when it is labeled miss, or a hit
# that returned the answer of a different seed than `target`.
#
# Ground truth comes from the HW4 seed of s4098_rel (SEED 4098): routes RT-001..RT-005 =
# VTA Route 22, VTA Green Line, VTA Route 522, VTA Orange Line, VTA Route 55.

