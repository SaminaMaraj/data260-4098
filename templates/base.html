<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Municipal Transit Incidents{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/">Transit Incident Hub</a>
        <div class="d-flex align-items-center gap-3">
            {% if user %}
                <span class="text-white small">Signed in as {{ user.name }}</span>
                <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
                <a class="btn btn-light btn-sm text-primary" href="/logout">Log out</a>
            {% else %}
                <a class="btn btn-light btn-sm text-primary" href="/login">Log in</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container py-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
