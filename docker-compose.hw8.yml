# HW8: Kafka (KRaft, single broker) + Part 1 worker + Part 1 FastAPI wrapper
#   docker compose -f docker-compose.hw8.yml up -d --build
# Host scripts (homework_demo.py, agents, tests) use localhost:9092.
# Containers talk to the broker on kafka:19092.
services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: s4098-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      # topics are created explicitly (create_topics.sh / ensure_topics)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/hw8.Dockerfile
    image: s4098-hw8-app
    container_name: s4098-incident-worker
    command: ["python", "-u", "-m", "src.hw8_kafka.worker"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      HW8_IDEMPOTENCY: ${HW8_IDEMPOTENCY:-on}
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  api:
    image: s4098-hw8-app
    container_name: s4098-incident-api
    command: ["uvicorn", "src.hw8_kafka.api:app", "--host", "0.0.0.0", "--port", "8498"]
    ports:
      - "8498:8498"
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
      worker:
        condition: service_started
    restart: on-failure
